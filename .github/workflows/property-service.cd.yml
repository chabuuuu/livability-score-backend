name: "[STAGING] CI & CD KLTN Property Service [BE] (Swarm)"

env:
  SERVICE_NAME: kltn_property_stack
  SERVICE_IMAGE: kltn-property-service-be
  DEPLOY_FOLDER: /home/gha-runner/kltn/backend/property_service
  ENV_FILE_PATH: /home/gha-runner/kltn/backend/property_service/env_file/.env

on:
  push:
    branches:
      - staging
    paths:
      - "property_service/**"
      - ".github/workflows/property-service.cd.yml"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Cấp quyền ghi vào GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./property_service
          push: true
          # Tag image với cả version cụ thể và tag 'latest' để dễ debug
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/${{ env.SERVICE_IMAGE }}:${{ github.ref_name }}-${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER }}/${{ env.SERVICE_IMAGE }}:latest

  deploy_swarm:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Checkout code (để lấy file docker-compose.yml)
        uses: actions/checkout@v3

      - name: Copy docker compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          source: "./property_service/docker-compose.yml"
          target: ${{ env.DEPLOY_FOLDER }}
          strip_components: 1 # Loại bỏ folder cha property_service khi copy

      - name: Deploy to Docker Swarm
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            # 1. Login Docker trên Server (để Swarm có thể pull image private)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Setup biến môi trường
            export GITHUB_REPOSITORY_OWNER_LOWERCASE=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
            export IMAGE_VERSION=${{ github.ref_name }}-${{ github.sha }}

            # 3. Di chuyển đến folder chứa .env và docker-compose.yml
            cd ${{ env.DEPLOY_FOLDER }}

            # Copy file .env vào vị trí mong muốn (nếu chưa đúng chỗ)
            # Giả sử file .env đã nằm sẵn ở ENV_FILE_PATH và bạn muốn link nó
            # docker stack deploy hỗ trợ env_file nhưng file phải nằm cùng chỗ lệnh chạy
            cp ${{ env.ENV_FILE_PATH }} .env

            # 4. Deploy Stack
            # --with-registry-auth: Gửi thông tin login xuống các Worker node để chúng pull được image
            docker stack deploy --with-registry-auth -c docker-compose.yml ${{ env.SERVICE_NAME }}

            # (Optional) Cleanup image cũ để tiết kiệm ổ cứng (prune)
            docker image prune -af
