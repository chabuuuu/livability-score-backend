name: "[STAGING] CI & CD KLTN Recommendation Service [BE]"

env:
  # Backend deployment folder on the server
  DEPLOY_FOLDER: /home/gha-runner/kltn/backend/recommendation_service/source

  # ENV file path on the server
  ENV_FILE_PATH: /home/gha-runner/kltn/backend/recommendation_service/env_file/.env

  # Image name for the Docker container
  IMAGE_NAME: kltn-recommendation-service-be:${{ github.ref_name }}-${{ github.sha }}

  # Container name for the service
  CONTAINER_NAME: kltn-recommendation-service-be

  # The filename for the Docker image artifact
  IMAGE_FILENAME: kltn-recommendation-service-be.tar

  SERVICE_FOLDER: recommendation_service

  # Docker Compose file path
  DOCKER_COMPOSE_PATH: ./recommendation_service/docker-compose.yml

  PROJECT_NAME: "KLTN Recommendation Service [BE]"

on:
  push:
    branches:
      - staging
    paths:
      - "recommendation_service/**"
      - ".github/workflows/recommendation-service.cd.yml"

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} ./${{ env.SERVICE_FOLDER }}

      - name: Save Docker image to a tar file
        run: docker save -o ${{ env.IMAGE_FILENAME }} ${{ env.IMAGE_NAME }}

      - name: Make image file readable
        run: chmod 644 ${{ env.IMAGE_FILENAME }}

      - name: Copy Docker image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST_RECOMMENDATION }}
          username: ${{ secrets.SERVER_USER_RECOMMENDATION }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY_RECOMMENDATION }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE_RECOMMENDATION }}
          port: 22
          source: "${{ env.IMAGE_FILENAME }}"
          target: "/tmp" # Copy to a temporary directory on the server

      - name: Clean old docker compose script and old env file
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST_RECOMMENDATION }}
          username: ${{ secrets.SERVER_USER_RECOMMENDATION }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY_RECOMMENDATION }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE_RECOMMENDATION }}
          port: 22
          script: |
            rm -rf ${{ env.DEPLOY_FOLDER }}/*

      - name: Copy new docker compose script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST_RECOMMENDATION }}
          username: ${{ secrets.SERVER_USER_RECOMMENDATION }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY_RECOMMENDATION }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE_RECOMMENDATION }}
          source: "./${{ env.SERVICE_FOLDER }}/docker-compose.yml"
          target: ${{ env.DEPLOY_FOLDER }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_publish

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST_RECOMMENDATION }}
          username: ${{ secrets.SERVER_USER_RECOMMENDATION }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY_RECOMMENDATION }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE_RECOMMENDATION }}
          port: 22
          script: |
            cp ${{ env.ENV_FILE_PATH }} ${{ env.DEPLOY_FOLDER }}/${{ env.SERVICE_FOLDER }}
            cd ${{ env.DEPLOY_FOLDER }}
            echo "Loading new image from tar file..."
            docker load -i /tmp/${{ env.IMAGE_FILENAME }}
            if [ "$(docker ps -aq -f name=^${{ env.CONTAINER_NAME }}$)" ]; then
                docker compose -f ${{ env.DOCKER_COMPOSE_PATH }} down ${{ env.CONTAINER_NAME }}
            fi
            echo "Waiting for new container: ${{ env.CONTAINER_NAME }} to pull..."
            IMAGE_VERSION=${{ github.ref_name }}-${{ github.sha }} docker compose -f ${{ env.DOCKER_COMPOSE_PATH }} pull ${{ env.CONTAINER_NAME }}
            echo "Start new container: ${{ env.CONTAINER_NAME }}..."
            IMAGE_VERSION=${{ github.ref_name }}-${{ github.sha }} docker compose -f ${{ env.DOCKER_COMPOSE_PATH }} up -d ${{ env.CONTAINER_NAME }}
