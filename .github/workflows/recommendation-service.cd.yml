name: "[STAGING] CI & CD KLTN Recommendation Service [BE]"

env:
  # Thư mục chứa code deploy trên server
  DEPLOY_FOLDER: /home/gha-runner/kltn/backend/recommendation_service/source

  # Đường dẫn file .env gốc nằm trên server (đã có sẵn)
  ENV_FILE_PATH: /home/gha-runner/kltn/backend/recommendation_service/env_file/.env

  # Tên Image cơ bản (không bao gồm tag version để dễ tái sử dụng)
  BASE_IMAGE_NAME: kltn-recommendation-service-be

  # Tạo Tag version dựa trên branch và commit hash
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}

  # Tên file ảnh Docker sẽ lưu
  IMAGE_FILENAME: kltn-recommendation-service-be.tar

  # Thư mục code trong repo
  SERVICE_FOLDER: recommendation_service

on:
  push:
    branches:
      - staging
    paths:
      - "recommendation_service/**"
      - ".github/workflows/recommendation-service.cd.yml"

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        # Build image với tag cụ thể
        run: docker build -t ${{ env.BASE_IMAGE_NAME }}:${{ env.IMAGE_TAG }} ./${{ env.SERVICE_FOLDER }}

      - name: Save Docker image to a tar file
        # Lưu image ra file .tar
        run: docker save -o ${{ env.IMAGE_FILENAME }} ${{ env.BASE_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Make image file readable
        run: chmod 644 ${{ env.IMAGE_FILENAME }}

      - name: Copy Docker image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST_RECOMMENDATION }}
          username: ${{ secrets.SERVER_USER_RECOMMENDATION }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY_RECOMMENDATION }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE_RECOMMENDATION }}
          port: 22
          source: "${{ env.IMAGE_FILENAME }}"
          target: "/tmp" # Copy vào thư mục tạm

      - name: Clean deploy folder on server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST_RECOMMENDATION }}
          username: ${{ secrets.SERVER_USER_RECOMMENDATION }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY_RECOMMENDATION }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE_RECOMMENDATION }}
          port: 22
          # Xóa thư mục cũ và tạo lại để đảm bảo sạch sẽ
          script: |
            rm -rf ${{ env.DEPLOY_FOLDER }}
            mkdir -p ${{ env.DEPLOY_FOLDER }}

      - name: Copy new docker compose script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST_RECOMMENDATION }}
          username: ${{ secrets.SERVER_USER_RECOMMENDATION }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY_RECOMMENDATION }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE_RECOMMENDATION }}
          source: "./${{ env.SERVICE_FOLDER }}/docker-compose.yml"
          target: ${{ env.DEPLOY_FOLDER }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_publish

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST_RECOMMENDATION }}
          username: ${{ secrets.SERVER_USER_RECOMMENDATION }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY_RECOMMENDATION }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE_RECOMMENDATION }}
          port: 22
          script: |
            # 1. Di chuyển vào thư mục deploy
            cd ${{ env.DEPLOY_FOLDER }}/${{ env.SERVICE_FOLDER }}

            # 2. Copy file .env từ nơi lưu trữ bí mật vào thư mục hiện tại để docker-compose đọc
            cp ${{ env.ENV_FILE_PATH }} ${{ env.DEPLOY_FOLDER }}/${{ env.SERVICE_FOLDER }}

            # 3. Load image mới từ file tar trong /tmp
            echo "Loading new image..."
            docker load -i /tmp/${{ env.IMAGE_FILENAME }}

            # 4. Dọn dẹp file tar để tiết kiệm dung lượng
            rm /tmp/${{ env.IMAGE_FILENAME }}

            # 5. Export biến môi trường IMAGE_VERSION để docker-compose.yml sử dụng
            export IMAGE_VERSION=${{ env.IMAGE_TAG }}
            echo "Deploying version: $IMAGE_VERSION"

            # 6. Chạy Docker Compose
            # - down: Tắt các container cũ (để đảm bảo sạch sẽ, hoặc bỏ qua nếu muốn zero-downtime tuy nhiên với worker thì nên restart hẳn)
            # - up -d: Dựng lại container mới
            docker compose down --remove-orphans
            docker compose up -d

            # 7. Dọn dẹp các image cũ không dùng đến (dangling images)
            docker image prune -f
