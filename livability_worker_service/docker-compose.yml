version: "3.9"

services:
  kltn-livability-worker-service-be:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER_LOWERCASE}/livability-worker-service-be:${IMAGE_VERSION}
    env_file:
      - .env

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

      placement:
        constraints:
          - node.role == worker

      resources:
        limits:
          cpus: "0.2"
          memory: 500M

        reservations:
          cpus: "0.1"
          memory: 256M

      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
