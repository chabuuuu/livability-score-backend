version: "3.9"

services:
  kltn-media-service-be:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER_LOWERCASE}/media-service-be:${IMAGE_VERSION}
    ports:
      - "127.0.0.1:9093:8080"
    env_file:
      - .env
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

      resources:
        limits:
          cpus: "0.1"
          memory: 200M

        reservations:
          cpus: "0.1"
          memory: 50M

      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
