version: "3.9"

services:
  kltn-recommendation-service-be:
    image: kltn-recommendation-service-be:${IMAGE_VERSION}
    ports:
      - "9094:8084"
    env_file:
      - .env

    restart: unless-stopped

    deploy:
      # replicas: 1

      # restart_policy:
      #   condition: on-failure

      resources:
        limits:
          cpus: "0.2"
          memory: 3G

        reservations:
          cpus: "0.2"
          memory: 1.5G

      # update_config:
      #   parallelism: 1
      #   delay: 10s
      #   order: stop-first

    volumes:
      - model_cache_data:/app/model_files

volumes:
  model_cache_data:
